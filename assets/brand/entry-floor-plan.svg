<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Conceptual floor plan</title>
  <desc id="plan-desc">A hand-drawn style conceptual plan in green lines on cream: a house wrapped around a central courtyard with a tree, bench and water basin; living room, entry with stair, kitchen, dining room, bedroom, bath, closet and garden room; door swings, windows, a street-tree edge, side gardens and a terrace. Not to scale.</desc>
  <defs>
    <style>
      .w{fill:none;stroke:#466b45;stroke-width:12;stroke-linecap:square}
      .c{fill:none;stroke:#466b45;stroke-width:8;stroke-linecap:square}
      .p{fill:none;stroke:#557a50;stroke-width:5;stroke-linecap:square}
      .f{fill:none;stroke:#5f8156;stroke-width:1.6;stroke-linejoin:round}
      .t{fill:none;stroke:#8eaa80;stroke-width:1.1}
      .d{fill:none;stroke:#8eaa80;stroke-width:1.1;stroke-dasharray:6 6}
      .sw{fill:none;stroke:#5f8156;stroke-width:1.2;stroke-dasharray:3 4}
      .gl{fill:none;stroke:#5f8156;stroke-width:1.2}
      .gap{fill:#f3efe0;stroke:none}
      .lbl{font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:4px;fill:#5f8156}
      .sm{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:3px;fill:#7d9a70}
      .tr circle,.tr path{vector-effect:non-scaling-stroke}
    </style>
    <pattern id="pave" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b9c9a8" stroke-width="1"/>
    </pattern>
    <pattern id="plant" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#8eaa80"/><circle cx="11" cy="10" r="1" fill="#a8bd98"/>
    </pattern>
    <g id="tree" class="tr">
      <circle r="60" fill="#e7ebd3" fill-opacity=".55" stroke="#5f8156" stroke-width="1.6"/>
      <circle r="44" fill="none" stroke="#8eaa80" stroke-width="1" stroke-dasharray="5 6"/>
      <path d="M0-12V-34M0 12V34M-12 0H-34M12 0H34M-9-9L-24-24M9 9L24 24M9-9L24-24M-9 9L-24 24" fill="none" stroke="#8eaa80" stroke-width="1"/>
      <circle r="5" fill="#466b45"/>
    </g>
  </defs>

  <!-- paper -->
  <rect width="1600" height="1040" fill="#f3efe0"/>

  <!-- site boundary, street edge and dimension line -->
  <rect x="40" y="40" width="1520" height="920" class="d"/>
  <path d="M40 872H1560M40 960H1560" class="t"/>
  <path d="M300 140H1300M300 180V126M640 180V126M1000 180V126M1300 180V126" class="t"/>
  <path d="M292 148L308 132M632 148L648 132M992 148L1008 132M1292 148L1308 132" class="f"/>

  <!-- north hedge -->
  <g class="t">
    <circle cx="330" cy="92" r="16"/><circle cx="366" cy="88" r="18"/><circle cx="404" cy="94" r="15"/><circle cx="440" cy="90" r="17"/>
    <circle cx="478" cy="94" r="15"/><circle cx="514" cy="89" r="18"/><circle cx="552" cy="93" r="15"/><circle cx="588" cy="90" r="17"/>
    <circle cx="1010" cy="92" r="16"/><circle cx="1046" cy="88" r="18"/><circle cx="1084" cy="94" r="15"/><circle cx="1120" cy="90" r="17"/>
    <circle cx="1158" cy="94" r="15"/><circle cx="1194" cy="89" r="18"/><circle cx="1232" cy="93" r="15"/><circle cx="1268" cy="90" r="17"/>
  </g>

  <!-- north arrow -->
  <g transform="translate(1470 104)">
    <circle r="28" class="f"/>
    <path d="M0-22L9 12L0 5L-9 12Z" fill="#466b45"/>
    <text y="-36" text-anchor="middle" class="sm">N</text>
  </g>

  <!-- courtyard paving -->
  <rect x="646" y="346" width="348" height="288" fill="url(#pave)"/>

  <!-- west garden -->
  <rect x="86" y="420" width="140" height="130" rx="6" fill="url(#plant)" class="f"/>
  <rect x="86" y="690" width="110" height="150" rx="6" fill="url(#plant)" class="f"/>
  <!-- east terrace and planter -->
  <rect x="1330" y="620" width="170" height="220" fill="url(#pave)" class="f"/>
  <rect x="1500" y="400" width="34" height="200" fill="url(#plant)" class="f"/>
  <!-- garden furniture on terrace -->
  <circle cx="1415" cy="730" r="26" class="f"/>
  <rect x="1360" y="712" width="22" height="22" rx="4" class="f"/><rect x="1448" y="712" width="22" height="22" rx="4" class="f"/>
  <rect x="1404" y="664" width="22" height="22" rx="4" class="f"/><rect x="1404" y="774" width="22" height="22" rx="4" class="f"/>

  <!-- entry path stepping stones -->
  <g class="f">
    <rect x="570" y="816" width="60" height="18" rx="3"/><rect x="574" y="846" width="56" height="18" rx="3"/>
    <rect x="568" y="878" width="60" height="18" rx="3"/><rect x="572" y="912" width="58" height="18" rx="3"/>
  </g>

  <!-- ======= building: outer walls with openings ======= -->
  <path class="w" d="M300 180H1300M300 180V800M300 800H560M640 800H1300M1300 180V700M1300 780V800"/>
  <!-- windows (wall knocked out, glazing lines) -->
  <g>
    <rect class="gap" x="380" y="172" width="140" height="16"/><path class="gl" d="M380 177H520M380 183H520M380 172V188M520 172V188"/>
    <rect class="gap" x="720" y="172" width="180" height="16"/><path class="gl" d="M720 177H900M720 183H900M720 172V188M900 172V188"/>
    <rect class="gap" x="1080" y="172" width="140" height="16"/><path class="gl" d="M1080 177H1220M1080 183H1220M1080 172V188M1220 172V188"/>
    <rect class="gap" x="292" y="250" width="16" height="200"/><path class="gl" d="M297 250V450M303 250V450M292 250H308M292 450H308"/>
    <rect class="gap" x="700" y="792" width="240" height="16"/><path class="gl" d="M700 797H940M700 803H940M700 792V808M940 792V808"/>
    <rect class="gap" x="1292" y="240" width="16" height="180"/><path class="gl" d="M1297 240V420M1303 240V420M1292 240H1308M1292 420H1308"/>
    <rect class="gap" x="1080" y="792" width="160" height="16"/><path class="gl" d="M1080 797H1240M1080 803H1240M1080 792V808M1240 792V808"/>
  </g>

  <!-- courtyard walls with door and slider openings -->
  <path class="c" d="M640 340H780M860 340H1000M640 640H780M860 640H1000M640 340V440M640 520V640M1000 340V540M1000 600V640"/>
  <!-- sliding glass at west and east courtyard openings -->
  <path class="gl" d="M636 440V486M644 474V520M996 540V574M1004 566V600"/>

  <!-- interior partitions -->
  <path class="p" d="M300 520H520M600 520H640M640 180V260M640 640V680M640 760V800M1000 180V230M1000 300V340M1000 480H1060M1140 480H1300M1160 480V520M1160 580V640M1000 640H1300M1000 640V680M1000 760V800"/>

  <!-- door swings -->
  <g class="f">
    <path d="M560 800V720A80 80 0 0 1 640 800"/>
    <path d="M1300 780H1220A80 80 0 0 1 1300 700"/>
    <path d="M520 520V600A80 80 0 0 0 600 520"/>
    <path d="M780 340V420A80 80 0 0 0 860 340"/>
    <path d="M860 640V560A80 80 0 0 0 780 640"/>
    <path d="M1000 230H1070A70 70 0 0 1 1000 300"/>
    <path d="M1140 480V560A80 80 0 0 1 1060 480"/>
    <path d="M1160 520H1220A60 60 0 0 1 1160 580"/>
    <path d="M1000 760H1080A80 80 0 0 0 1000 680"/>
    <path d="M640 680H720A80 80 0 0 1 640 760"/>
  </g>

  <!-- ======= furniture ======= -->
  <g class="f">
    <!-- living: sofa, rug, table, chairs -->
    <rect x="336" y="228" width="210" height="48" rx="8"/><path d="M336 244H546M406 244V276M476 244V276"/>
    <rect x="384" y="300" width="200" height="170" class="d"/>
    <ellipse cx="482" cy="374" rx="52" ry="30"/>
    <rect x="352" y="400" width="54" height="54" rx="10"/><rect x="552" y="300" width="54" height="54" rx="10"/>
    <!-- entry: stair, console, bench -->
    <rect x="330" y="548" width="90" height="230"/>
    <path d="M330 568H420M330 588H420M330 608H420M330 628H420M330 648H420M330 668H420M330 688H420M330 708H420M330 728H420M330 748H420"/>
    <path d="M375 760V566M367 578L375 562L383 578"/>
    <rect x="450" y="538" width="150" height="24"/>
    <rect x="452" y="760" width="90" height="26" rx="4"/>
    <!-- kitchen: counter, sink, hob, island, stools -->
    <rect x="652" y="192" width="336" height="44"/>
    <rect x="752" y="198" width="56" height="32" rx="8"/>
    <circle cx="884" cy="206" r="8"/><circle cx="910" cy="206" r="8"/><circle cx="884" cy="224" r="8"/><circle cx="910" cy="224" r="8"/>
    <rect x="716" y="262" width="208" height="46"/>
    <circle cx="742" cy="324" r="10"/><circle cx="794" cy="324" r="10"/><circle cx="846" cy="324" r="10"/><circle cx="898" cy="324" r="10"/>
    <!-- courtyard: planters, bench, water basin -->
    <rect x="656" y="354" width="96" height="30" fill="url(#plant)"/>
    <rect x="890" y="354" width="96" height="30" fill="url(#plant)"/>
    <rect x="664" y="572" width="104" height="26" rx="3"/>
    <rect x="896" y="548" width="88" height="70"/><rect x="904" y="556" width="72" height="54" class="t"/>
    <path d="M914 576q8-6 16 0t16 0t16 0M914 590q8-6 16 0t16 0t16 0" class="t"/>
    <!-- dining: long table and chairs -->
    <rect x="700" y="690" width="240" height="60" rx="4"/>
    <rect x="718" y="668" width="18" height="16" rx="3"/><rect x="778" y="668" width="18" height="16" rx="3"/><rect x="838" y="668" width="18" height="16" rx="3"/><rect x="898" y="668" width="18" height="16" rx="3"/>
    <rect x="718" y="756" width="18" height="16" rx="3"/><rect x="778" y="756" width="18" height="16" rx="3"/><rect x="838" y="756" width="18" height="16" rx="3"/><rect x="898" y="756" width="18" height="16" rx="3"/>
    <rect x="676" y="711" width="16" height="18" rx="3"/><rect x="948" y="711" width="16" height="18" rx="3"/>
    <!-- bedroom: bed, pillows, nightstands, desk, rug -->
    <rect x="1088" y="196" width="160" height="214" rx="4"/>
    <rect x="1102" y="206" width="62" height="30" rx="8"/><rect x="1172" y="206" width="62" height="30" rx="8"/>
    <path d="M1088 262H1248M1088 270H1248"/>
    <rect x="1050" y="198" width="30" height="30"/><rect x="1256" y="198" width="30" height="30"/>
    <rect x="1060" y="380" width="214" height="80" class="d"/>
    <rect x="1022" y="320" width="42" height="120"/><circle cx="1078" cy="380" r="13"/>
    <!-- bath: tub, basin, wc -->
    <rect x="1014" y="562" width="134" height="68" rx="30"/><rect x="1022" y="570" width="118" height="52" rx="24" class="t"/>
    <rect x="1012" y="494" width="38" height="56"/><ellipse cx="1031" cy="522" rx="11" ry="16" class="t"/>
    <!-- closet shelving -->
    <rect x="1248" y="492" width="40" height="140"/><path d="M1248 512H1288M1248 532H1288M1248 552H1288M1248 572H1288M1248 592H1288M1248 612H1288" class="t"/>
    <!-- garden room: sofa, lounge chairs, round table -->
    <rect x="1060" y="746" width="176" height="38" rx="6"/>
    <circle cx="1148" cy="702" r="24"/>
    <rect x="1186" y="656" width="48" height="48" rx="10" transform="rotate(18 1210 680)"/>
    <rect x="1066" y="656" width="48" height="48" rx="10" transform="rotate(-18 1090 680)"/>
  </g>

  <!-- ======= trees ======= -->
  <use href="#tree" transform="translate(820 470) scale(1.35)"/>
  <use href="#tree" transform="translate(170 300) scale(1.25)"/>
  <use href="#tree" transform="translate(190 620) scale(.95)"/>
  <use href="#tree" transform="translate(1430 300) scale(1.4)"/>
  <use href="#tree" transform="translate(1460 520) scale(.9)"/>
  <use href="#tree" transform="translate(150 912) scale(.8)"/>
  <use href="#tree" transform="translate(400 916) scale(.85)"/>
  <use href="#tree" transform="translate(860 912) scale(.8)"/>
  <use href="#tree" transform="translate(1120 916) scale(.85)"/>
  <use href="#tree" transform="translate(1390 912) scale(.8)"/>
  <use href="#tree" transform="translate(110 120) scale(.75)"/>

  <!-- ======= labels ======= -->
  <text x="820" y="628" text-anchor="middle" class="lbl">COURTYARD</text>
  <text x="470" y="500" text-anchor="middle" class="lbl">LIVING</text>
  <text x="530" y="680" text-anchor="middle" class="lbl">ENTRY</text>
  <text x="1150" y="470" text-anchor="middle" class="sm">BEDROOM</text>
  <text x="1415" y="610" text-anchor="middle" class="sm">TERRACE</text>
  <text x="156" y="404" text-anchor="middle" class="sm">GARDEN</text>
  <text x="720" y="944" text-anchor="middle" class="sm">STREET</text>
  <text x="60" y="1008" class="sm">CONCEPTUAL PLAN — NOT TO SCALE</text>
</svg>
